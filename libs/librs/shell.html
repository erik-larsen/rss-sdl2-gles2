<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Really Slick Screensaver</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #000; color: #ccc;
      font-family: -apple-system, system-ui, sans-serif;
    }
    #canvas {
      display: block; width: 100vw; height: 100vh;
      border: 0; outline: none; background: #000;
    }
    #status {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 14px; letter-spacing: 0.1em; color: #888;
      pointer-events: none; transition: opacity 0.6s; text-align: center;
    }
    #status.hidden { opacity: 0; }
    #bar {
      width: 220px; height: 2px; margin: 14px auto 0; background: #222;
      border-radius: 2px; overflow: hidden;
    }
    #bar > div { height: 100%; width: 0; background: #6cf; transition: width 0.2s; }

    /* Controls HUD */
    #hud {
      position: fixed; top: 14px; right: 14px; z-index: 10;
      background: rgba(16,16,24,0.82); border: 1px solid #2a2a38;
      border-radius: 10px; padding: 12px 14px 12px 14px;
      font-size: 12px; color: #d6d6e2; min-width: 200px; max-width: 260px;
      max-height: calc(100vh - 44px); overflow-y: auto;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.4s, transform 0.4s;
      box-shadow: 0 4px 18px rgba(0,0,0,0.45);
    }
    #hud.hidden { opacity: 0; transform: translateY(-6px); pointer-events: none; }
    #hud h2 {
      margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #9a9ab0;
    }
    #hud .row { display: flex; justify-content: space-between; gap: 16px; margin: 4px 0; line-height: 1.5; align-items: center; }
    #hud .row .act { color: #aab; }
    #hud kbd {
      font-family: inherit; font-size: 11px; color: #cdf;
      background: #20202c; border: 1px solid #34344a; border-bottom-width: 2px;
      border-radius: 4px; padding: 1px 6px; min-width: 14px; text-align: center;
      display: inline-block;
    }
    /* per-saver options */
    #opts .sect {
      margin: 10px 0 6px; padding-top: 8px; border-top: 1px solid #2a2a38;
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: #9a9ab0;
    }
    #opts .orow { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 7px 0; align-items: center; }
    #opts .oname { color: #aab; }
    #opts .oval  { color: #cdf; font-variant-numeric: tabular-nums; text-align: right; }
    #opts input[type=range] {
      grid-column: 1 / span 2; width: 100%; margin: 0; accent-color: #6cf; height: 18px;
    }
    #opts input[type=checkbox] { accent-color: #6cf; margin: 0; }
    #opts select {
      grid-column: 1 / span 2; width: 100%;
      background: #20202c; color: #cdf; border: 1px solid #34344a; border-radius: 4px;
      font: inherit; font-size: 11px; padding: 2px 4px;
    }
    #opts .btns { display: flex; gap: 8px; margin-top: 10px; }
    #opts button {
      flex: 1; background: #20202c; color: #cdf; border: 1px solid #34344a;
      border-radius: 5px; font: inherit; font-size: 11px; padding: 4px 0; cursor: pointer;
    }
    #opts button:hover { background: #2a2a3c; }
    #opts button.primary { background: #1c3a50; border-color: #2c5a7a; }
    #opts button.primary:hover { background: #23485f; }

    /* small floating "?" button to reopen the HUD once hidden */
    #hudtoggle {
      position: fixed; top: 14px; right: 14px; z-index: 9;
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(16,16,24,0.7); border: 1px solid #2a2a38; color: #9a9ab0;
      font-size: 13px; line-height: 24px; text-align: center; cursor: pointer;
      transition: opacity 0.4s, background 0.15s; opacity: 0;
    }
    #hudtoggle.show { opacity: 0.6; }
    #hudtoggle.show:hover { opacity: 1; background: rgba(30,30,44,0.9); }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">loading<div id="bar"><div id="barfill"></div></div></div>

  <div id="hud">
    <h2 id="hudtitle">Controls</h2>
    <div class="row"><span class="act">Show/hide controls</span> <kbd>H</kbd></div>
    <div class="row"><span class="act">Toggle FPS</span> <kbd>F1</kbd></div>
    <div class="row"><span class="act">Back to gallery</span> <kbd>Esc</kbd></div>
    <div id="opts"></div>
  </div>
  <div id="hudtoggle" title="Show controls (H)">?</div>

  <script type="text/javascript">
    var statusEl = document.getElementById('status');
    var barEl = document.getElementById('barfill');
    var hideTimer = null;

    var Module = {
      canvas: (function () {
        var c = document.getElementById('canvas');
        c.addEventListener('webglcontextlost', function (e) {
          alert('WebGL context lost. Please reload.'); e.preventDefault();
        }, false);
        return c;
      })(),
      // Per-saver options arrive as URL query params (?particles=100&size=20,
      // set by the HUD's Apply) and are handed to the saver as real argv, so
      // its unmodified handleCommandLine() parses them like the CLI would.
      arguments: (function () {
        var a = [];
        try {
          new URLSearchParams(location.search).forEach(function (v, k) {
            a.push('-' + k, v);
          });
        } catch (e) {}
        return a;
      })(),
      setStatus: function (text) {
        if (!text) {
          statusEl.classList.add('hidden');
          if (!hideTimer) hideTimer = setTimeout(function () {
            if (window.rssHud) window.rssHud.autohide();
          }, 4000);
          return;
        }
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          barEl.style.width = (parseInt(m[2]) / parseInt(m[4]) * 100) + '%';
          statusEl.firstChild.textContent = m[1].trim() || 'loading';
        } else {
          statusEl.firstChild.textContent = text;
          if (!text.length) barEl.style.width = '100%';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'preparing (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : '');
      }
    };
    Module.setStatus('downloading');
    window.onerror = function () { Module.setStatus('exception — see console'); };

    // gl4es tuning: prefer VBOs, batch immediate-mode geometry.
    Module.preRun = Module.preRun || [];
    Module.preRun.push(function () {
      if (typeof ENV !== 'undefined') {
        ENV.LIBGL_USEVBO = '1';
        ENV.LIBGL_BATCH = '1';
        // ?fpslog=1: frame-pacing stats on the console (see librs RSS_FPS_LOG)
        if (location.search.indexOf('fpslog') !== -1) ENV.RSS_FPS_LOG = '1';
      }
    });

    // ---- Controls HUD ----
    (function () {
      var hud = document.getElementById('hud');
      var toggle = document.getElementById('hudtoggle');
      var titleEl = document.getElementById('hudtitle');

      // Title the HUD with the saver's name, taken from the page's own
      // filename in the URL (e.g. .../flux/flux.html -> "flux"). This is
      // available immediately and doesn't depend on emscripten's async script
      // tag having been parsed yet. Falls back to "Controls".
      var name = '';
      try {
        var m = (location.pathname || '').match(/([^\/]+?)(?:\.html?)?$/i);
        if (m && m[1] && m[1].toLowerCase() !== 'index') name = m[1];
      } catch (e) {}
      if (name) {
        titleEl.textContent = name.charAt(0).toUpperCase() + name.slice(1) + ' • Controls';
        document.title = name.charAt(0).toUpperCase() + name.slice(1);
      }

      // Keep HUD interactions away from SDL. Emscripten's SDL registers
      // document-level mouse/touch handlers that preventDefault, which
      // cancels the native drag on the panel's <input type=range> — the
      // thumb snaps back to its old value on release. Stopping propagation
      // at the panel boundary leaves the controls' native behavior intact
      // (the events still reach their targets) but SDL never sees them.
      // Native range-drag uses implicit pointer capture, so even drags that
      // wander off the panel keep targeting the input and are caught here.
      ['pointerdown', 'pointermove', 'pointerup', 'mousedown', 'mousemove',
       'mouseup', 'touchstart', 'touchmove', 'touchend', 'wheel', 'click',
       'dblclick'].forEach(function (t) {
        hud.addEventListener(t, function (e) { e.stopPropagation(); });
        toggle.addEventListener(t, function (e) { e.stopPropagation(); });
      });

      var visible = true;
      function show() { visible = true; hud.classList.remove('hidden'); toggle.classList.remove('show'); }
      function hide() { visible = false; hud.classList.add('hidden'); toggle.classList.add('show'); }

      window.rssHud = {
        // Called ~4s after load: fade the panel down to just the "?" button,
        // so the saver is unobstructed but the legend stays one keypress away.
        autohide: function () { if (visible) hide(); }
      };

      // 'H' or '?' toggles the panel. Esc/Q leaves the saver page: back to
      // the previous page when there is one, else up to the gallery. (The
      // wasm shell would otherwise treat Esc/Q as "quit", ending the main
      // loop and leaving a dead black canvas.) Both are handled here in the
      // page, capture-phase, so they never reach the wasm canvas. When the
      // browser is fullscreen, Esc is left alone — it exits fullscreen.
      window.addEventListener('keydown', function (e) {
        if (e.key === 'h' || e.key === 'H' || e.key === '?') {
          visible ? hide() : show();
          e.preventDefault();
        } else if ((e.key === 'Escape' || e.key === 'q' || e.key === 'Q') &&
                   !document.fullscreenElement) {
          e.preventDefault();
          e.stopImmediatePropagation();
          if (document.referrer && history.length > 1) history.back();
          else location.href = '../';
        }
      }, true);

      toggle.addEventListener('click', show);

      // ---- Per-saver options (built from options.json next to the page) ----
      // Values are applied by reloading with URL query params; the savers read
      // their settings once at startup, so a reload is the honest lifecycle.
      fetch('options.json').then(function (r) {
        return r.ok ? r.json() : null;
      }).then(function (meta) {
        if (!meta || !meta.options || !meta.options.length) return;
        var params = new URLSearchParams(location.search);
        var box = document.getElementById('opts');
        var controls = [];

        var sect = document.createElement('div');
        sect.className = 'sect'; sect.textContent = 'Options';
        box.appendChild(sect);

        meta.options.forEach(function (o) {
          var cur = params.has(o.opt) ? Number(params.get(o.opt))
                  : (o.default !== undefined ? o.default : (o.min !== undefined ? o.min : 0));
          var row = document.createElement('div'); row.className = 'orow';
          var nameEl = document.createElement('span');
          nameEl.className = 'oname'; nameEl.textContent = o.opt;
          row.appendChild(nameEl);
          var input, valEl = null;

          if (o.kind === 'preset') {
            nameEl.textContent = 'preset';
            input = document.createElement('select');
            for (var i = o.min; i <= o.max; i++) {
              var op = document.createElement('option');
              op.value = i;
              op.textContent = (o.names && o.names[i]) ? o.names[i] : ('preset ' + i);
              input.appendChild(op);
            }
            input.value = cur;
            row.appendChild(document.createElement('span'));
            row.appendChild(input);
          } else if (o.kind === 'bool') {
            input = document.createElement('input');
            input.type = 'checkbox';
            input.checked = cur >= 1;
            row.appendChild(input);
          } else {
            valEl = document.createElement('span');
            valEl.className = 'oval'; valEl.textContent = cur;
            row.appendChild(valEl);
            input = document.createElement('input');
            input.type = 'range';
            input.min = o.min !== undefined ? o.min : 0;
            input.max = o.max !== undefined ? o.max : 100;
            input.step = 1;
            input.value = cur;
            input.addEventListener('input', function () { valEl.textContent = input.value; });
            row.appendChild(input);
          }
          box.appendChild(row);
          controls.push({ o: o, input: input });
        });

        var btns = document.createElement('div'); btns.className = 'btns';
        var apply = document.createElement('button');
        apply.className = 'primary'; apply.textContent = 'Apply';
        apply.addEventListener('click', function () {
          var p = new URLSearchParams();
          controls.forEach(function (c) {
            var v = c.o.kind === 'bool' ? (c.input.checked ? 1 : 0) : Number(c.input.value);
            if (v !== (c.o.default !== undefined ? c.o.default : NaN)) p.set(c.o.opt, v);
          });
          var q = p.toString();
          if (q !== location.search.replace(/^\?/, '')) {
            // replace() so settings states don't pile up in history —
            // Esc (history.back) then leaves the saver, not the settings
            location.replace(location.pathname + (q ? '?' + q : ''));
          }
        });
        var reset = document.createElement('button');
        reset.textContent = 'Defaults';
        reset.addEventListener('click', function () {
          if (location.search) location.replace(location.pathname);
          else controls.forEach(function (c) {
            var d = c.o.default !== undefined ? c.o.default : (c.o.min !== undefined ? c.o.min : 0);
            if (c.o.kind === 'bool') c.input.checked = d >= 1;
            else { c.input.value = d; c.input.dispatchEvent(new Event('input')); }
          });
        });
        btns.appendChild(apply); btns.appendChild(reset);
        box.appendChild(btns);

        // If the user customized settings, keep the panel open on load.
        if (location.search) window.rssHud.autohide = function () {};
      }).catch(function () { /* no options.json: plain legend */ });
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
